const lessons=[
['ハングルとは？','文字の成り立ちと基本構造',`<p>ハングルは韓国語を書くための文字です。15世紀に世宗（セジョン）のもとで作られ、1446年に訓民正音として公布されました。</p><p>基本の文字は母音10種類と子音14種類。これらを組み合わせ、原則として1音節を1つの四角い文字にまとめます。</p><p>日本語の「か」は1文字ですが、ハングルの 가 は子音と母音を組み合わせた文字です。</p>`,[['가','ㄱ ＋ ㅏ → 가（カ／ガ）'],['한','ㅎ ＋ ㅏ ＋ ㄴ → 한（ハン）']],'文字を丸暗記するより、部品と組み立て方を覚えましょう。'],
['基本母音','日本語の「あいうえお」との違い',`<p>基本母音は10種類。6種類の単母音と、ヤ行に近い4種類の音からなります。短い線を2本にすると、最初に y に近い音が加わります。</p><p>ㅓ と ㅗ はどちらも「オ」に近いですが、ㅓ は唇を丸めず、ㅗ は丸めます。ㅡ と ㅜ も「ウ」に近く、ㅡ は唇を丸めず、ㅜ は丸めます。</p><p>「エ」に近い ㅐ・ㅔ は文字の分類では複合母音です。母音だけの音節を書くときは、無音の ㅇ を添えます。</p>`,[['아','ㅏ ア (a)'],['야','ㅑ ヤ (ya)'],['어','ㅓ オ (eo)'],['여','ㅕ ヨ (yeo)'],['오','ㅗ オ (o)'],['요','ㅛ ヨ (yo)'],['우','ㅜ ウ (u)'],['유','ㅠ ユ (yu)'],['으','ㅡ ウ (eu)'],['이','ㅣ イ (i)']],'カナは目安です。似た音を交互に聞き比べましょう。'],
['基本子音','14種類の子音',`<p>子音は母音と組み合わせて読みます。ㄱ・ㄷ・ㅂ・ㅈ は位置などによって濁って聞こえることがあります。</p><p>ㄴ は舌先を上の歯茎に、ㅁ は唇を閉じて発音します。ㄹ は母音の前では日本語のラ行に近く、末尾では舌先を歯茎につけます。ㅇ は音節の先頭では無音です。</p><p>ㅋ・ㅌ・ㅍ・ㅊ は息を強く出す激音です。ㅎ はハ行に近い音です。</p>`,[['가','ㄱ カ／ガ'],['나','ㄴ ナ'],['다','ㄷ タ／ダ'],['라','ㄹ ラ'],['마','ㅁ マ'],['바','ㅂ パ／バ'],['사','ㅅ サ'],['아','ㅇ 無音'],['자','ㅈ チャ／ジャ'],['차','ㅊ チャ（激音）'],['카','ㅋ カ（激音）'],['타','ㅌ タ（激音）'],['파','ㅍ パ（激音）'],['하','ㅎ ハ']],'子音単独ではなく、同じ母音 ㅏ を添えて聞き比べましょう。'],
['文字の組み立て方','子音と母音の配置',`<p>縦長の母音（ㅏ・ㅓ・ㅣ など）は子音の右に、横長の母音（ㅗ・ㅜ・ㅡ など）は子音の下に置きます。</p><p>最後に子音がある場合は、さらに下に置きます。これをパッチムと呼びます。</p><p>母音から始まる音節には、先頭に無音の ㅇ を置きます。</p>`,[['가','ㄱ ＋ ㅏ（左右）'],['고','ㄱ ＋ ㅗ（上下）'],['한','ㅎ ＋ ㅏ ＋ ㄴ（下に終声）'],['아','ㅇ ＋ ㅏ（母音だけの音）'],['한국','한 ＋ 국（韓国）']],'四角い文字を部品に分けて読むのがコツです。'],
['複合母音','エ・ワ・ウェなどの音',`<p>基本母音を組み合わせた11種類の母音があります。ㅐ・ㅔ は現代韓国語では同じように発音する人が多いです。</p><p>ㅘ は ㅗ＋ㅏ、ㅝ は ㅜ＋ㅓ の組み合わせです。ㅚ・ㅟ には話者による発音の違いがあります。ㅢ は単語内の位置や助詞としての使い方で読み方が変わることがあります。</p>`,[['애','ㅐ エ'],['얘','ㅒ イェ'],['에','ㅔ エ'],['예','ㅖ イェ'],['와','ㅘ ワ'],['왜','ㅙ ウェ'],['외','ㅚ ウェ（一般的な発音）'],['워','ㅝ ウォ'],['웨','ㅞ ウェ'],['위','ㅟ ウィ'],['의','ㅢ ウィに近い音']],'まずは文字の形を覚え、音声で確認しましょう。'],
['濃音と激音','3種類の子音を聞き比べる',`<p>韓国語には平音・激音・濃音という区別があります。日本語の清音と濁音の区別とは異なります。</p><p>激音は息を強く出します。濃音は喉や口の構えを緊張させ、息を強く吹き出さずに発音します。小さい「ッ」はあくまでカナでの目安です。</p><p>濃音は ㄲ・ㄸ・ㅃ・ㅆ・ㅉ の5種類です。</p>`,[['가','平音 ㄱ'],['카','激音 ㅋ'],['까','濃音 ㄲ'],['다','平音 ㄷ'],['타','激音 ㅌ'],['따','濃音 ㄸ'],['바','平音 ㅂ'],['파','激音 ㅍ'],['빠','濃音 ㅃ'],['사','平音 ㅅ'],['싸','濃音 ㅆ'],['자','平音 ㅈ'],['차','激音 ㅊ'],['짜','濃音 ㅉ']],'口の前に手を置くと、激音の息を感じやすくなります。'],
['パッチム','文字の下につく子音',`<p>音節の最後の子音をパッチムと呼びます。単独で発音するときの代表的な終声は7種類（ㄱ・ㄴ・ㄷ・ㄹ・ㅁ・ㅂ・ㅇ）です。</p><p>ㄱ・ㄷ・ㅂ は最後に母音を足さず、口の動きを止めます。ㄴ・ㅁ・ㅇ は鼻に響く音ですが、舌や唇の位置が異なります。ㄹ は舌先を上の歯茎につけます。</p><p>異なる綴りでも同じ終声になることがあります。例えば 옷 の ㅅ は単独では ㄷ と同じ終声になります。</p>`,[['국','ㄱ：クに近い終声'],['산','ㄴ：ン（舌先）'],['옷','ㅅ → ㄷ：ッに近い終声'],['달','ㄹ：ルに近い終声'],['밤','ㅁ：ムに近い終声'],['밥','ㅂ：プに近い終声'],['방','ㅇ：ン（舌の奥）']],'「ク」「プ」「ム」の最後に日本語のウを足さないようにしましょう。'],
['発音変化','綴りと実際の読み方',`<p>文字を組み合わせて単語を読むと、隣の音の影響で発音が変わることがあります。</p><p><b>連音化：</b>パッチムの後に母音で始まる助詞などが続くと、終声が次の音節の先頭に移ることがあります。</p><p><b>鼻音化：</b>ㄱ・ㄷ・ㅂ 系の終声が ㄴ・ㅁ の前で鼻音に変わることがあります。</p><p><b>濃音化：</b>終声などの影響で次の平音が濃音になることがあります。</p>`,[['한국어','한국어 → 한구거（連音化）'],['옷이','옷이 → 오시（連音化）'],['국물','국물 → 궁물（鼻音化）'],['학교','학교 → 학꾜（濃音化）']],'すべての規則を最初から覚える必要はありません。単語の音声と一緒に少しずつ覚えましょう。']
];
function introTop(){stop();app.innerHTML=`<h2>📖 ハングル入門講座</h2><p class="hint">文字の仕組みを基礎から学ぼう。全8章・好きな章から読めます。</p><div class="intro-list">${lessons.map((l,i)=>`<button onclick="introLesson(${i})"><b>${String(i+1).padStart(2,'0')}　${l[0]}</b><br><small>${l[1]}</small></button>`).join('')}</div>`;window.scrollTo(0,0)}
function introLesson(i){stop();let l=lessons[i];app.innerHTML=`<p><button onclick="introTop()">← 講座一覧</button></p><div class="intro-body"><small>第${i+1}章 / ${lessons.length}</small><h2>${l[0]}</h2>${l[2]}<h3>文字と音声の例</h3>${l[3].map((v,j)=>`<div class="intro-example"><div><strong lang="ko">${esc(v[0])}</strong><br><span>${esc(v[1])}</span></div><button id="introAudio${j}" aria-label="音声再生">🔊</button></div>`).join('')}<p class="intro-tip">💡 ${l[4]}</p><p class="hint">カナ表記は発音の目安です。音声は端末の韓国語読み上げ機能を使用します。</p></div><div class="row">${i>0?`<button onclick="introLesson(${i-1})">← 前の章</button>`:'<span></span>'}${i<lessons.length-1?`<button onclick="introLesson(${i+1})">次の章 →</button>`:'<button onclick="introTop()">講座一覧へ</button>'}</div>`;l[3].forEach((v,j)=>document.getElementById('introAudio'+j).onclick=()=>speak(v[0]));window.scrollTo(0,0)}

home();</script></html>
