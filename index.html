ent.getElementById('next').onclick=()=>{qi++;question()}}function bestKey(){return kind+":"+(kind==='h'?stage+":":"")+dir}function finish(){if(!active)return;stop();let old=saved.bests[bestKey()]||0,record=score>old;if(record)saved.bests[bestKey()]=score;saved.tests++;let before=saved.travel;saved.travel=Math.min(30000,before+score*({h:1,w:3,p:5}[kind]));let fresh=unlock();save();app.innerHTML=`<div class="panel"><h2>テスト終了</h2><div class="ko">${score} 問正解</div><p>${record?'🎉 自己ベスト更新！':'お疲れさまでした！'}　自己ベスト：${saved.bests[bestKey()]||0}問</p><p>移動距離 +${km(saved.travel-before)} km ／ 累計 ${km(saved.travel)} km</p>${fresh.length?`<h2>🎉 カード獲得！</h2>${fresh.map(c=>`<p>${c.name}　${c.ko}</p>`).join('')}<button onclick="album()">図鑑を見る</button>`:''}<button class="primary full" onclick="choose(kind,'test')">もう一度</button><p><button onclick="home()">ホームへ</button></p></div>`}
const route=[["ソウル", "서울", "景福宮:경복궁,北村韓屋村:북촌한옥마을,南山ソウルタワー:남산서울타워"], ["坡州", "파주", "臨津閣:임진각,ヘイリ芸術村:헤이리 예술마을"], ["春川", "춘천", "南怡島:남이섬,タッカルビ:닭갈비"], ["束草", "속초", "雪岳山:설악산,束草中央市場:속초중앙시장"], ["江陵", "강릉", "鏡浦台:경포대,烏竹軒:오죽헌"], ["東海", "동해", "湫岩燭台岩:추암 촛대바위"], ["三陟", "삼척", "幻仙窟:환선굴"], ["蔚珍", "울진", "聖留窟:성류굴"], ["安東", "안동", "河回村:하회마을,安東チムタク:안동찜닭"], ["栄州", "영주", "浮石寺:부석사"], ["大邱", "대구", "西門市場:서문시장,八公山:팔공산"], ["慶州", "경주", "仏国寺:불국사,石窟庵:석굴암,瞻星台:첨성대"], ["浦項", "포항", "虎尾串:호미곶"], ["蔚山", "울산", "大王岩公園:대왕암공원"], ["釜山", "부산", "海雲台:해운대,甘川文化村:감천문화마을,広安里:광안리"], ["金海", "김해", "首露王陵:수로왕릉"], ["昌原", "창원", "鎮海:진해"], ["統営", "통영", "東ピラン村:동피랑마을"], ["巨済", "거제", "外島:외도"], ["晋州", "진주", "晋州城:진주성"], ["順天", "순천", "順天湾湿地:순천만습지"], ["麗水", "여수", "梧桐島:오동도"], ["済州", "제주", "漢拏山:한라산,城山日出峰:성산일출봉,万丈窟:만장굴"], ["西帰浦", "서귀포", "天地淵瀑布:천지연폭포,正房瀑布:정방폭포"], ["木浦", "목포", "儒達山:유달산"], ["光州", "광주", "無等山:무등산"], ["潭陽", "담양", "竹緑苑:죽녹원"], ["全州", "전주", "全州韓屋村:전주한옥마을,ビビンバ:비빔밥"], ["益山", "익산", "弥勒寺址:미륵사지"], ["群山", "군산", "近代歴史博物館:근대역사박물관"], ["扶余", "부여", "定林寺址:정림사지"], ["公州", "공주", "公山城:공산성"], ["大田", "대전", "儒城温泉:유성온천"], ["清州", "청주", "古印刷博物館:고인쇄박물관"], ["忠州", "충주", "中央塔:중앙탑"], ["堤川", "제천", "清風文化財団地:청풍문화재단지"], ["丹陽", "단양", "島潭三峰:도담삼봉"], ["原州", "원주", "雉岳山:치악산"], ["利川", "이천", "陶磁器:도자기"], ["水原", "수원", "水原華城:수원화성"], ["華城", "화성", "隆健陵:융건릉"], ["安山", "안산", "大阜島:대부도"], ["仁川", "인천", "チャイナタウン:차이나타운,松島:송도"], ["金浦", "김포", "文殊山城:문수산성"], ["高陽", "고양", "一山湖公園:일산호수공원"], ["ソウル帰着", "서울", "韓国一周達成:한국 일주"]];const cards=[];route.forEach((r,i)=>{let start=Math.round(i*3000/(route.length-1)*10),end=Math.round((i+1)*3000/(route.length-1)*10);cards.push({id:'c'+i,at:start,name:r[0],ko:r[1],type:'都市'});r[2].split(',').forEach((v,j,a)=>{let [name,ko]=v.split(':');cards.push({id:'s'+i+'-'+j,at:i===route.length-1?30000:Math.round(start+(end-start)*(j+1)/(a.length+1)),name,ko,type:'名所・文化',city:r[0]})})});cards.sort((a,b)=>a.at-b.at);saved.travel=Math.max(0,Math.min(30000,Number(saved.travel)||0));saved.cards??=[];function unlock(){let fresh=cards.filter(c=>c.at<=saved.travel&&!saved.cards.includes(c.id));saved.cards.push(...fresh.map(c=>c.id));return fresh}unlock();save();function km(n){return (n/10).toFixed(1)}function tripPanel(){let next=cards.find(c=>c.at>saved.travel),city=[...cards].reverse().find(c=>c.type==='都市'&&c.at<=saved.travel);return `<div class="panel"><h2>🇰🇷 韓国一周の旅</h2><div class="ko">${km(saved.travel)} km</div><p>全長 3,000 km · ${city.name}</p><div class="bar"><div style="width:${saved.travel/300}%"></div></div><p>${next?'次のカード：'+next.name+'（あと '+km(next.at-saved.travel)+' km）':'🎉 韓国一周達成！'}</p><div class="grid"><button onclick="journey()">周遊ルート</button><button onclick="album()">図鑑 ${saved.cards.length}/${cards.length}</button></div></div>`}function journey(){stop();app.innerHTML=tripPanel()+`<h2>周遊ルート</h2><p class="hint">ゲーム上の設定距離です。済州島へは海上移動を想定しています。</p>`+cards.filter(c=>c.type==='都市').map(c=>`<p>${c.at<=saved.travel?'✅':'○'} ${km(c.at)} km　${c.name}　${c.ko}</p>`).join('')}function album(){stop();app.innerHTML=`<h2>旅の図鑑 ${saved.cards.length}/${cards.length}</h2><div class="grid">`+cards.map(c=>saved.cards.includes(c.id)?`<button onclick="cardDetail('${c.id}')"><span style="font-size:30px">${c.type==='都市'?'🏙️':'🏞️'}</span><br>${c.name}<br><small>${c.ko}</small></button>`:`<button disabled>🔒 未獲得<br><small>${km(c.at)} km</small></button>`).join('')+'</div>'}function cardDetail(id){let c=cards.find(x=>x.id===id);if(!c||!saved.cards.includes(id))return;app.innerHTML=`<div class="panel"><div class="flag">${c.type==='都市'?'🏙️':'🏞️'}</div><h2>${c.name}</h2><div class="ko">${c.ko}</div><p>${c.type} ${c.city||''} · ${km(c.at)} km</p><button id="cardAudio">🔊 音声</button><p><button onclick="album()">図鑑へ戻る</button></p></div>`;document.getElementById('cardAudio').onclick=()=>speak(c.ko)}
